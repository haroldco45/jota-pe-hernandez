<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Jota Pe Hernández - Firme</title>
<meta name="description" content="Noticias del día, gestión legislativa y videos del senador Jota Pe Hernández.">
<meta name="theme-color" content="#0a0a0a">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800;900&family=Archivo+Narrow:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0a0a; --panel:#141414; --panel2:#1b1b1b; --line:#262626;
  --txt:#f5f5f4; --muted:#a3a3a3; --dim:#6b6b6b;
  --oro:#facc15; --oro2:#eab308; --rojo:#ef4444; --verde:#22c55e;
  --r:18px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--txt);font-family:'Archivo',system-ui,sans-serif;-webkit-tap-highlight-color:transparent;min-height:100vh;
  background-image:radial-gradient(ellipse 120% 50% at 50% -10%,rgba(250,204,21,.13),transparent 60%)}
[hidden]{display:none!important}
.toast:empty{display:none}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.wrap{max-width:480px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 18px) 16px 40px}

/* Barra superior */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:22px}
.estado{display:flex;align-items:center;gap:8px;font:700 11px 'Archivo Narrow';letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.punto{width:8px;height:8px;border-radius:50%;background:var(--dim)}
.punto.vivo{background:var(--verde);box-shadow:0 0 0 0 rgba(34,197,94,.6);animation:pulso 2s infinite}
.punto.error{background:var(--rojo)}
@keyframes pulso{70%{box-shadow:0 0 0 8px rgba(34,197,94,0)}100%{box-shadow:0 0 0 0 rgba(34,197,94,0)}}
.acciones{display:flex;gap:8px}
.btn-ic{width:40px;height:40px;border-radius:12px;background:var(--panel);border:1px solid var(--line);display:grid;place-items:center;transition:transform .15s}
.btn-ic:active{transform:scale(.92)}
.btn-ic svg{width:18px;height:18px}
.girando svg{animation:gira 1s linear infinite}
@keyframes gira{to{transform:rotate(360deg)}}

/* Perfil */
.perfil{text-align:center;margin-bottom:22px}
.foto{position:relative;display:inline-block;margin-bottom:14px}
.foto img,.foto .ini{width:112px;height:112px;border-radius:50%;object-fit:cover;border:3px solid var(--oro2);padding:3px;background:var(--bg)}
.foto .ini{display:grid;place-items:center;font:900 38px 'Archivo';color:var(--oro)}
.check{position:absolute;right:4px;bottom:8px;width:24px;height:24px;border-radius:50%;background:#2563eb;border:3px solid var(--bg);display:grid;place-items:center}
.check svg{width:12px;height:12px}
h1{font-weight:900;font-style:italic;font-size:30px;letter-spacing:-.03em;line-height:1;text-transform:uppercase}
.cargo{margin-top:8px;font:700 12px 'Archivo Narrow';letter-spacing:.22em;text-transform:uppercase;color:var(--oro)}
.sub{margin-top:6px;font-size:12px;color:var(--muted)}

/* Redes */
.redes{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:26px}
.red{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;transition:transform .15s,border-color .15s}
.red:active{transform:scale(.95);border-color:var(--oro2)}
.red svg{width:22px;height:22px}
.red span{font:700 10px 'Archivo Narrow';letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}

/* Secciones */
.sec{margin-bottom:26px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px}
.sec-h h2{font:900 13px 'Archivo';letter-spacing:.18em;text-transform:uppercase}
.sec-h h2 b{color:var(--oro)}
.sec-h small{font-size:11px;color:var(--dim)}

/* Hoy */
.hoy{background:linear-gradient(160deg,#1c1806,var(--panel) 55%);border:1px solid #3a3210;border-radius:var(--r);padding:16px}
.fecha-hoy{font:700 12px 'Archivo Narrow';letter-spacing:.12em;text-transform:uppercase;color:var(--oro);margin-bottom:10px}
.vacio{font-size:13px;color:var(--muted);line-height:1.5;padding:4px 0 10px}

/* Tarjeta noticia */
.nota{display:block;padding:12px 0;border-top:1px solid var(--line)}
.nota:first-child{border-top:0;padding-top:2px}
.nota h3{font-weight:700;font-size:15px;line-height:1.3;margin-bottom:6px}
.meta{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:11px;color:var(--dim)}
.fuente{color:var(--oro2);font-weight:600}
.nuevo{background:var(--oro);color:#000;font:800 9px 'Archivo';letter-spacing:.08em;padding:2px 6px;border-radius:6px;text-transform:uppercase}
.lista{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}

/* Buscador */
.buscar{display:flex;gap:8px;margin-bottom:10px}
.buscar input{flex:1;min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;color:var(--txt);font:500 14px 'Archivo';outline:none}
.buscar input:focus{border-color:var(--oro2)}
.buscar button{background:var(--oro);color:#000;border-radius:14px;padding:0 16px;font:800 12px 'Archivo';letter-spacing:.06em;text-transform:uppercase}
.buscar button:active{transform:scale(.96)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--panel);font:600 12px 'Archivo';color:var(--muted)}
.chip.on{background:var(--txt);color:#000;border-color:var(--txt)}
.mas{display:block;width:100%;margin-top:10px;padding:12px;border-radius:14px;border:1px dashed var(--line);font:700 12px 'Archivo';color:var(--muted);letter-spacing:.06em;text-transform:uppercase}

/* Gestión legislativa */
details.ley{background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden;margin-bottom:8px}
details.ley.dia{border-color:#3a3210}
details.ley summary{list-style:none;display:flex;align-items:center;gap:12px;padding:14px 16px;cursor:pointer}
details.ley summary::-webkit-details-marker{display:none}
.ley-em{font-size:20px;flex:none}
.ley-t{flex:1;font:800 13px 'Archivo';line-height:1.25;text-transform:uppercase;letter-spacing:-.01em}
.ley-tag{display:block;font:700 9px 'Archivo Narrow';letter-spacing:.14em;color:var(--oro);margin-bottom:3px}
.flecha{width:16px;height:16px;color:var(--dim);transition:transform .25s;flex:none}
details[open] .flecha{transform:rotate(180deg)}
.ley-c{padding:0 16px 16px;animation:entra .3s ease-out}
.ley-c p{font-size:13px;color:var(--muted);line-height:1.55;margin-bottom:12px}
.btn-oro{display:block;text-align:center;background:var(--oro);color:#000;font:800 11px 'Archivo';letter-spacing:.08em;text-transform:uppercase;padding:11px;border-radius:12px}
@keyframes entra{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}

/* Videos */
.video{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:10px}
.marco{aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:#000}
.marco iframe{width:100%;height:100%;border:0;display:block}
.video h3{font-size:14px;font-weight:700;line-height:1.3;padding:10px 4px 2px}
.mini{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.mini button{text-align:left}
.mini img{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:10px;display:block;border:2px solid transparent}
.mini button.on img{border-color:var(--oro)}
.mini span{display:block;font-size:10px;color:var(--muted);line-height:1.25;margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* Esqueleto */
.sk{height:14px;border-radius:6px;background:linear-gradient(90deg,#1b1b1b,#262626,#1b1b1b);background-size:200% 100%;animation:sk 1.2s infinite;margin:10px 0}
@keyframes sk{to{background-position:-200% 0}}

/* Aviso */
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 20px);transform:translate(-50%,120px);background:var(--txt);color:#000;font:700 13px 'Archivo';padding:12px 18px;border-radius:14px;transition:transform .3s;z-index:9;max-width:90vw;text-align:center}
.toast.ver{transform:translate(-50%,0)}

footer{text-align:center;padding-top:20px;font:700 10px 'Archivo Narrow';letter-spacing:.25em;color:var(--dim);text-transform:uppercase;line-height:1.8}
footer b{display:block;color:var(--muted);font-size:12px;letter-spacing:.2em}
footer .nota-f{font:400 11px 'Archivo';letter-spacing:0;text-transform:none;margin-top:10px;color:var(--dim)}
</style>
</head>
<body>
<div class="wrap">

    <div class="acciones">
      <button class="btn-ic" id="btn-compartir" aria-label="Compartir">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 12v7a2 2 0 002 2h12a2 2 0 002-2v-7M16 6l-4-4-4 4M12 2v14"/></svg>

<script>
const TZ = 'America/Bogota';
const $ = s => document.querySelector(s);
const CONSULTAS = ['"Jota Pe Hernández"', '"JP Hernández" senador'];
const TEMAS = ['Todas','Cepeda','Senado','Fiscalía','Petro','Ley','Corrupción'];
const VIDEO_RESPALDO = 'sf06x3Wxa6U';

let noticias = [];     // fusionadas (robot + en vivo)
let tema = 'Todas';
let filtroTexto = '';
let mostrar = 8;
let ultimaVisita = Number(leer('jp-ultima') || 0);

/* ---------- utilidades ---------- */
function leer(k){ try{ return localStorage.getItem(k) }catch(e){ return null } }
function guardar(k,v){ try{ localStorage.setItem(k,v) }catch(e){} }
const diaBogota = d => new Intl.DateTimeFormat('en-CA',{timeZone:TZ}).format(d); // AAAA-MM-DD
const horaBogota = d => new Intl.DateTimeFormat('es-CO',{timeZone:TZ,hour:'numeric',minute:'2-digit'}).format(d);
const fechaLarga = d => new Intl.DateTimeFormat('es-CO',{timeZone:TZ,weekday:'long',day:'numeric',month:'long'}).format(d);
function hace(fecha){
  const s = (Date.now() - fecha) / 1000;
  if (s < 60) return 'hace un momento';
  if (s < 3600) return `hace ${Math.round(s/60)} min`;
  if (s < 86400) return `hace ${Math.round(s/3600)} h`;
  if (s < 172800) return 'ayer';
  return new Intl.DateTimeFormat('es-CO',{timeZone:TZ,day:'numeric',month:'short'}).format(fecha);
}
function esc(t=''){ return String(t).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])) }
function sinTildes(t=''){ return t.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase() }
function clave(t){ return sinTildes(t).replace(/[^a-z0-9 ]/g,'').replace(/\s+/g,' ').trim().slice(0,70) }
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('ver'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('ver'),2600) }
function estado(txt, tipo){ $('#estado-txt').textContent = txt; $('#punto').className = 'punto ' + (tipo||'') }

/* ---------- fuentes ---------- */
async function cargarRobot(){
  try{
    const r = await fetch('noticias.json?t=' + Date.now(), {cache:'no-store'});
    if (!r.ok) throw 0;
    return await r.json();
  }catch(e){ return null }
}

function parsearRSS(xml){
  const doc = new DOMParser().parseFromString(xml, 'text/xml');
  return [...doc.querySelectorAll('item')].map(it => {
    const fuente = it.querySelector('source')?.textContent?.trim() || '';
    let titulo = it.querySelector('title')?.textContent?.trim() || '';
    if (fuente && titulo.endsWith(' - ' + fuente)) titulo = titulo.slice(0, -(fuente.length + 3));
    return { titulo, enlace: it.querySelector('link')?.textContent?.trim(), fuente, fecha: new Date(it.querySelector('pubDate')?.textContent || 0).toISOString() };
  }).filter(n => n.titulo && n.enlace);
}

const PROXIES = [
  u => 'https://api.allorigins.win/raw?url=' + encodeURIComponent(u),
  u => 'https://corsproxy.io/?url=' + encodeURIComponent(u),
];
async function rssEnVivo(consulta){
  const url = `https://news.google.com/rss/search?q=${encodeURIComponent(consulta)}&hl=es-419&gl=CO&ceid=CO:es-419`;
  for (const p of PROXIES){
    try{
      const ctl = new AbortController(); const to = setTimeout(()=>ctl.abort(), 9000);
      const r = await fetch(p(url), {cache:'no-store', signal:ctl.signal});
      clearTimeout(to);
      if (!r.ok) continue;
      const items = parsearRSS(await r.text());
      if (items.length) return items;
    }catch(e){}
  }
  return [];
}
async function buscarEnVivo(extra=''){
  const res = await Promise.all(CONSULTAS.map(c => rssEnVivo(`${c} ${extra} when:7d`.trim())));
  return res.flat();
}

function fusionar(...listas){
  const vistos = new Map();
  for (const n of listas.flat()){
    if (!n?.titulo) continue;
    const k = clave(n.titulo);
    if (!vistos.has(k)) vistos.set(k, n);
  }
  return [...vistos.values()].sort((a,b) => new Date(b.fecha) - new Date(a.fecha));
}

/* ---------- pintar ---------- */
function tarjeta(n){
  const f = new Date(n.fecha);
  const esNueva = ultimaVisita && f.getTime() > ultimaVisita;
  return `<a class="nota" href="${esc(n.enlace)}" target="_blank" rel="noopener">
    <h3>${esc(n.titulo)}</h3>
    <div class="meta">${esNueva?'<span class="nuevo">Nuevo</span>':''}<span class="fuente">${esc(n.fuente||'Medio')}</span><span>${hace(f)}</span></div>
  </a>`;
}

function pintarHoy(){
  const ahora = new Date();
  const hoy = diaBogota(ahora);
  const f = fechaLarga(ahora);
  $('#fecha-hoy').textContent = f.charAt(0).toUpperCase() + f.slice(1);
  $('#hoy-hora').textContent = 'Hora Colombia ' + horaBogota(ahora);
  const deHoy = noticias.filter(n => diaBogota(new Date(n.fecha)) === hoy);
  if (deHoy.length){
    $('#hoy-lista').innerHTML = deHoy.slice(0,6).map(tarjeta).join('');
  } else if (noticias.length){
    $('#hoy-lista').innerHTML = `<p class="vacio">Todavía no hay noticias publicadas hoy. Lo último que salió:</p>` + noticias.slice(0,2).map(tarjeta).join('');
  } else {
    $('#hoy-lista').innerHTML = `<p class="vacio">No se pudieron cargar noticias. Revisa tu conexión y toca actualizar.</p>`;
  }
}

function pintarLista(){
  let l = noticias;
  if (tema !== 'Todas') l = l.filter(n => sinTildes(n.titulo).includes(sinTildes(tema)));
  if (filtroTexto) l = l.filter(n => sinTildes(n.titulo + ' ' + (n.fuente||'')).includes(sinTildes(filtroTexto)));
  $('#total-txt').textContent = `${l.length} resultado${l.length===1?'':'s'}`;
  $('#lista').innerHTML = l.length ? l.slice(0, mostrar).map(tarjeta).join('') : `<p class="vacio">Sin resultados para ese filtro.</p>`;
  $('#btn-mas').hidden = l.length <= mostrar;
}

function pintarChips(){
  $('#chips').innerHTML = TEMAS.map(t => `<button class="chip ${t===tema?'on':''}" data-t="${t}">${t}</button>`).join('');
}

function pintarTodo(){ pintarHoy(); pintarLista() }

/* ---------- gestión legislativa (leyes.json) ---------- */
async function cargarLeyes(){
  try{
    const r = await fetch('leyes.json?t=' + Date.now(), {cache:'no-store'});
    if (!r.ok) throw 0;
    const data = await r.json();
    const lista = data.proyectos || [];
    if (!lista.length) return;
    const diaMes = Number(new Intl.DateTimeFormat('en-US',{timeZone:TZ,day:'numeric'}).format(new Date()));
    const iDia = diaMes % lista.length;
    const orden = [iDia, ...lista.map((_,i)=>i).filter(i=>i!==iDia)];
    $('#leyes').innerHTML = orden.map((i,pos) => {
      const p = lista[i];
      return `<details class="ley ${pos===0?'dia':''}" ${pos===0?'open':''}>
        <summary><span class="ley-em">${esc(p.emoji||'📜')}</span>
          <span class="ley-t">${pos===0?'<span class="ley-tag">Destacado de hoy</span>':''}${esc(p.titulo)}</span>
          <svg class="flecha" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/></svg>
        </summary>
        <div class="ley-c"><p>${esc(p.resumen||'')}</p>${p.enlace?`<a class="btn-oro" href="${esc(p.enlace)}" target="_blank" rel="noopener">Ver gestión completa</a>`:''}</div>
      </details>`;
    }).join('');
    $('#leyes-txt').textContent = `${lista.length} proyecto${lista.length===1?'':'s'}`;
    $('#sec-leyes').hidden = false;
  }catch(e){ $('#sec-leyes').hidden = true }
}

/* ---------- videos (del robot) ---------- */
function pintarVideos(videos){
  if (!videos?.length) return;
  const poner = v => {
    if (!$('#video-frame').src.includes(v.id)) $('#video-frame').src = `https://www.youtube.com/embed/${v.id}`;
    $('#video-titulo').textContent = v.titulo; $('#video-titulo').hidden = false;
    $('#video-txt').textContent = hace(new Date(v.fecha));
    document.querySelectorAll('.mini button').forEach(b => b.classList.toggle('on', b.dataset.id === v.id));
  };
  $('#video-mini').innerHTML = videos.slice(0,6).map(v => `<button data-id="${esc(v.id)}"><img loading="lazy" src="https://i.ytimg.com/vi/${esc(v.id)}/mqdefault.jpg" alt=""><span>${esc(v.titulo)}</span></button>`).join('');
  document.querySelectorAll('.mini button').forEach(b => b.onclick = () => poner(videos.find(v => v.id === b.dataset.id)));
  const actual = videos.find(v => $('#video-frame').src.includes(v.id));
  poner(actual || videos[0]);
}

/* ---------- ciclo de actualización ---------- */
let actualizando = false;
async function actualizar(manual=false){
  if (actualizando) return;
  actualizando = true;
  $('#btn-actualizar').classList.add('girando');
  estado('Buscando noticias…');

  const robot = await cargarRobot();
  if (robot){
    noticias = fusionar(noticias, robot.noticias || []);
    pintarTodo();
    pintarVideos(robot.videos);
  }

  const vivo = await buscarEnVivo();
  const antes = noticias.length;
  noticias = fusionar(noticias, vivo);
  pintarTodo();

  const ahora = new Date();
  if (vivo.length) estado('En vivo · ' + horaBogota(ahora), 'vivo');
  else if (robot) estado('Robot · ' + (robot.actualizado ? hace(new Date(robot.actualizado)) : 'sin fecha'), 'vivo');
  else estado('Sin conexión', 'error');

  if (manual){
    const nuevas = noticias.length - antes;
    toast(nuevas > 0 ? `${nuevas} noticia${nuevas===1?'':'s'} nueva${nuevas===1?'':'s'}` : 'Ya estás al día');
  }
  $('#btn-actualizar').classList.remove('girando');
  actualizando = false;
}

/* ---------- eventos ---------- */
$('#btn-actualizar').onclick = () => { cargarLeyes(); actualizar(true) };
$('#btn-compartir').onclick = async () => {
  const datos = { title:'Jota Pe Hernández', text:'Noticias del día del senador Jota Pe Hernández', url:location.href };
  try{ if (navigator.share) await navigator.share(datos); else { await navigator.clipboard.writeText(location.href); toast('Enlace copiado') } }catch(e){}
};
$('#chips').onclick = e => { const b = e.target.closest('.chip'); if (!b) return; tema = b.dataset.t; mostrar = 8; pintarChips(); pintarLista() };
$('#q').oninput = e => { filtroTexto = e.target.value.trim(); mostrar = 8; pintarLista() };
$('#form-buscar').onsubmit = async e => {
  e.preventDefault();
  const q = $('#q').value.trim();
  if (!q) return actualizar(true);
  $('#q').blur();
  estado('Buscando "' + q + '"…');
  const res = await buscarEnVivo(q);
  noticias = fusionar(noticias, res);
  pintarTodo();
  estado(res.length ? 'En vivo · ' + horaBogota(new Date()) : 'Sin resultados nuevos', res.length ? 'vivo' : '');
  toast(res.length ? `${res.length} resultado${res.length===1?'':'s'} en vivo` : 'No hubo resultados nuevos en la web');
};
$('#btn-mas').onclick = () => { mostrar += 8; pintarLista() };

// Al volver a la app: recalcula "Hoy" y busca si pasaron más de 5 minutos
let ultimaCarga = Date.now();
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible'){
    pintarHoy();
    if (Date.now() - ultimaCarga > 5*60*1000){ ultimaCarga = Date.now(); cargarLeyes(); actualizar() }
  } else {
    guardar('jp-ultima', String(Date.now()));
  }
});
window.addEventListener('pagehide', () => guardar('jp-ultima', String(Date.now())));
setInterval(pintarHoy, 60*1000);

/* ---------- arranque ---------- */
pintarChips();
pintarHoy();
cargarLeyes();
actualizar();
if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
